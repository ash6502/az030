[package]
name = "az030-emu"
version = "0.1.0"
edition = "2024"

[dependencies]
m68k = "0.14.3"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
] }

# Local copy of m68k 0.14.3 with the 68030 transparent-translation register layout
# fixed (see vendor/m68k/src/mmu/ttr.rs).
[patch.crates-io]
m68k = { path = "vendor/m68k" }
